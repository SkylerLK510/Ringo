name: Feature or workflow idea
description: Describe a task Ringo could make easier.
title: "idea: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task and the friction you encounter today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: A concrete example is helpful. Mention alternatives you considered.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: How would we know it helped?
      description: Describe an observable outcome, manual check or comparison.
    validations:
      required: true
