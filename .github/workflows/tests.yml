name: Offline runtime tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  containment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Resolve the offline test image to an immutable local ID
        run: |
          docker pull python:3.11-slim
          python - <<'PY'
          import os, subprocess
          image = subprocess.check_output(['docker', 'image', 'inspect', 'python:3.11-slim', '--format', '{{.Id}}'], text=True).strip()
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('RINGO_TEST_IMAGE=' + image + '\n')
          print(image)
          PY
      - run: python -m unittest tests.test_turnrun_isolation -v

  unittest:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -q
        env:
          RINGO_RELEASE_HOME: ${{ runner.temp }}/ringo-ci-state

  cli:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the context gate replays this repository's own history
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: cargo test --locked --no-fail-fast --all-features  # every failing test file, not just the first; the feature adds the turn runner
        working-directory: cli
        env:
          RINGO_RELEASE_HOME: ${{ runner.temp }}/ringo-cli-state
