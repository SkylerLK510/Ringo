name: Offline runtime tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  local-worker-containment:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Provision Linux worker containment
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Require real worker containment with the system Python
        run: /usr/bin/python3 -m unittest discover -s tests -p 'test_local_worker*.py' -q
        env:
          RINGO_REQUIRE_WORKER_SANDBOX: '1'

  containment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Resolve the offline test image to an immutable local ID
        run: |
          docker pull python:3.11
          python - <<'PY'
          import os, subprocess
          image = subprocess.check_output(['docker', 'image', 'inspect', 'python:3.11', '--format', '{{.Id}}'], text=True).strip()
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('RINGO_TEST_IMAGE=' + image + '\n')
          print(image)
          PY
      - run: python -m unittest tests.test_turnrun_isolation tests.test_turnrun_certify tests.test_turnrun_broker -v
      - name: Build the pinned native CLI image without inference
        run: |
          python turnrun_native_image.py --version 2.1.290 --platform linux-x64 \
            --base "$RINGO_TEST_IMAGE" --work "$RUNNER_TEMP/ringo-native-image"
          python - <<'PY'
          import os
          from pathlib import Path
          image = (Path(os.environ['RUNNER_TEMP']) / 'ringo-native-image/image-id.txt').read_text().strip()
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('RINGO_NATIVE_IMAGE=' + image + '\n')
          PY
      - name: Verify native startup and tool execution using local protocol replay
        run: python -m unittest tests.test_turnrun_native -v
      - name: Build the trusted scenario runner
        run: cargo build --manifest-path cli/Cargo.toml --locked --features turnrun --bin scenariorun
      - name: Build the pinned Codex subscription profile without inference
        run: |
          curl --fail --location --max-time 300 --output "$RUNNER_TEMP/codex.tar.gz" \
            https://github.com/openai/codex/releases/download/rust-v0.169.0/codex-x86_64-unknown-linux-musl.tar.gz
          curl --fail --location --max-time 60 --output "$RUNNER_TEMP/models.json" \
            https://raw.githubusercontent.com/openai/codex/rust-v0.169.0/codex-rs/models-manager/models.json
          python turnrun_codex_image.py --archive "$RUNNER_TEMP/codex.tar.gz" \
            --archive-sha256 9af4d751fce183faedea629437d5252dbf458eeb04130cf4f97be844621ea985 \
            --catalog "$RUNNER_TEMP/models.json" \
            --catalog-sha256 1384625c0b6b3e67d3c60da29becea2b017f2c283fc1e2d05b8edafb4698eb10 \
            --platform x86_64-unknown-linux-musl --base "$RINGO_TEST_IMAGE" \
            --work "$RUNNER_TEMP/ringo-codex-image"
          python - <<'PY'
          import os
          from pathlib import Path
          image = (Path(os.environ['RUNNER_TEMP']) / 'ringo-codex-image/image-id.txt').read_text().strip()
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('RINGO_CODEX_IMAGE=' + image + '\n')
          PY
      - name: Exercise Codex worker, resume, restart and native usage using local replay
        run: python -m unittest tests.test_turnrun_codex -v
        env:
          RINGO_SCENARIO_BINARY: ${{ github.workspace }}/cli/target/debug/scenariorun
      - name: Exercise real Session and native continuation against local replay
        run: python -m unittest tests.test_turnrun_live -v
        env:
          RINGO_SCENARIO_BINARY: ${{ github.workspace }}/cli/target/debug/scenariorun

  unittest:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -q
        env:
          RINGO_RELEASE_HOME: ${{ runner.temp }}/ringo-ci-state

  cli:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the context gate replays this repository's own history
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: cargo test --locked --no-fail-fast --all-features  # every failing test file, not just the first; the feature adds the turn runner
        working-directory: cli
        env:
          RINGO_RELEASE_HOME: ${{ runner.temp }}/ringo-cli-state
