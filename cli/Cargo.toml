[package]
name = "ringo-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22.1"
fancy-regex = { version = "0.11.0", default-features = false, features = ["perf"] }
indexmap = "2.14.2"
libc = "0.2.191"
pulldown-cmark = { version = "0.13.6", default-features = false }
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
regex = { version = "1.13.1", default-features = false, features = ["std", "perf", "unicode-gencat", "unicode-perl"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "arbitrary_precision"] }
sha2 = "0.10.9"
unicode-width = "0.2.3"

[lib]
name = "ringo_cli"

[[bin]]
name = "ringo"
path = "src/main.rs"

# The offline measurement runner (docs/TURN-RUNNER.md). Off by default, so `cargo install` and the
# updater's release build make only `ringo`; CI builds and tests it with --all-features.
[features]
turnrun = []

[[bin]]
name = "turnrun"
path = "src/bin/turnrun.rs"
required-features = ["turnrun"]

[[bin]]
name = "scenariorun"
path = "src/bin/scenariorun.rs"
required-features = ["turnrun"]

[[test]]
name = "gate_scenarios"
path = "tests/gate_scenarios.rs"
required-features = ["turnrun"]

[[test]]
name = "gate_turnrun"
path = "tests/gate_turnrun.rs"
required-features = ["turnrun"]

[profile.release]
lto = true
codegen-units = 1
strip = true
